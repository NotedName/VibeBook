[package]
name = "vibebook"
version = "0.1.0"
description = "VibeBook: an OJT logbook"
edition = "2021"

[lib]
name = "vibebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Added in phase 2 of RUST_PREP.md, when image work moves into Rust:
# image = "0.25"
