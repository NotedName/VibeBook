<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#151219" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VibeBook" />
    <meta name="format-detection" content="telephone=no" />
    <title>VibeBook</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
    />
    <script>
      // Apply the saved appearance (colour mode incl. AMOLED, accent colour, text size and the extra options) before first paint so the page does not flash,
      // and tint the phone's browser/status bar to match. Keys and attributes mirror src/theme.ts.
      try {
        var root = document.documentElement;
        var mode = localStorage.getItem("vibebook-theme");
        // AMOLED is a mode of its own now; older versions saved dark plus a separate AMOLED switch, so that pair still counts.
        var amoled = mode === "amoled" || (mode === "dark" && localStorage.getItem("vibebook-amoled") === "on");
        var size = localStorage.getItem("vibebook-text-size");
        // In the Android app the WebView can answer "light" on its first frame and correct itself a moment later, which showed a light
        // splash that then flipped to dark. There, the last answer it settled on (saved by src/theme.ts) is used until it has settled.
        var sysLight = window.matchMedia("(prefers-color-scheme: light)").matches;
        if ("__TAURI_INTERNALS__" in window) sysLight = localStorage.getItem("vibebook-system-light") === "1";
        var light = mode === "light" || (mode !== "dark" && mode !== "amoled" && sysLight);
        root.setAttribute("data-theme", light ? "light" : "dark");
        if (amoled && !light) root.setAttribute("data-amoled", "on");
        try { var hn = localStorage.getItem("vibebook-background"); if (hn) root.setAttribute("data-honey", hn); } catch (e) {}
        if (size !== null && /^[0-4]$/.test(size)) root.setAttribute("data-text-size", size);
        // Accent colour and the extra appearance options (src/theme.ts has the full list and validates them).
        var accent = localStorage.getItem("vibebook-accent");
        if (accent && /^(blue|teal|green|orange|red|pink|custom)$/.test(accent)) {
          root.setAttribute("data-accent", accent);
          var custom = localStorage.getItem("vibebook-accent-custom");
          if (accent === "custom" && custom && /^#[0-9a-f]{6}$/i.test(custom)) {
            root.style.setProperty("--accent", custom);
            var ch = [1, 3, 5].map(function (i) { var c = parseInt(custom.slice(i, i + 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
            root.style.setProperty("--accent-ink", 0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2] > 0.4 ? "#141414" : "#ffffff");
          }
        }
        if (localStorage.getItem("vibebook-bold") === "on") root.setAttribute("data-bold", "on");
        if (localStorage.getItem("vibebook-contrast") === "on") root.setAttribute("data-contrast", "high");
        if (localStorage.getItem("vibebook-underline-links") === "on") root.setAttribute("data-links", "underline");
        if (localStorage.getItem("vibebook-square-corners") === "on") root.setAttribute("data-corners", "square");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", light ? "#fdf7ff" : amoled ? "#000000" : "#151219");
      } catch (e) {}
    </script>

    <style>
      /* Splash screen. It lives here, outside React, so it paints before the app bundle has downloaded.
         src/splash.ts fades it out once the app is ready. */
      #splash {
        --sp-bg: #151219; --sp-text: #e6e0e9; --sp-accent: #cdb8e6; --sp-glow: rgba(126, 73, 179, .5);
        --sp-ease: cubic-bezier(.22, 1, .36, 1);
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; overflow: hidden;
        background: var(--sp-bg); color: var(--sp-text);
        transition: opacity .55s var(--sp-ease), transform .55s var(--sp-ease), visibility 0s linear .55s;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme="dark"]) #splash { --sp-bg: #fdf7ff; --sp-text: #1d1b20; --sp-accent: #6a3a9c; --sp-glow: rgba(126, 73, 179, .3); }
      }
      html[data-theme="light"] #splash { --sp-bg: #fdf7ff; --sp-text: #1d1b20; --sp-accent: #6a3a9c; --sp-glow: rgba(126, 73, 179, .3); }
      html[data-theme="dark"][data-amoled="on"] #splash { --sp-bg: #000000; }
      #splash.out { opacity: 0; visibility: hidden; transform: scale(1.04); pointer-events: none; }

      .sp-glow {
        position: absolute; inset: 0; margin: auto; width: min(80vw, 460px); height: min(80vw, 460px); border-radius: 50%;
        background: radial-gradient(circle, var(--sp-glow), transparent 65%); filter: blur(12px);
        animation: sp-glow 3.2s ease-in-out infinite;
      }
      .sp-in { position: relative; display: grid; justify-items: center; gap: 20px; padding: 24px; }
      .sp-mark { width: 92px; height: 92px; overflow: visible; }
      .sp-p {
        fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1 1; animation: sp-draw .7s cubic-bezier(.65, 0, .35, 1) both;
        animation-delay: calc(.1s + var(--i) * .08s);
      }
      .sp-p.ray1 { stroke: #b23cff; }
      .sp-p.ray2 { stroke: #ff6aa8; }
      .sp-p.ray3 { stroke: #ffa15a; }
      /* the two pages swing open from the spine */
      .sp-l, .sp-r { transform-box: fill-box; animation: sp-draw .7s cubic-bezier(.65, 0, .35, 1) both, sp-open .9s cubic-bezier(.22, 1, .36, 1) both; animation-delay: .1s, .1s; }
      .sp-l { transform-origin: 100% 50%; }
      .sp-r { transform-origin: 0 50%; }
      @keyframes sp-open { from { transform: scaleX(.04); } to { transform: none; } }
      .sp-word {
        display: flex; font: 700 40px/1.1 "Poppins", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: -.02em;
      }
      .sp-word b {
        display: inline-block; font-weight: 700;
        animation: sp-rise .6s var(--sp-ease) both, sp-wave 1.5s ease-in-out infinite;
        animation-delay: calc(.4s + var(--i) * .05s), calc(1.5s + var(--i) * .08s);
      }
      .sp-word .a { color: var(--sp-accent); }
      .sp-bar {
        width: 120px; height: 4px; border-radius: 4px; overflow: hidden; background: rgba(127, 127, 127, .25);
        opacity: 0; animation: sp-pop .4s ease 1.2s forwards;
      }
      .sp-bar i {
        display: block; width: 40%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, #b23cff, #ff6aa8, #ffa15a); animation: sp-bar 1.3s ease-in-out infinite;
      }
      @keyframes sp-draw { 0% { stroke-dashoffset: 1; opacity: 0; } 8% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(.55em) scale(.9); filter: blur(6px); } to { opacity: 1; transform: none; filter: blur(0); } }
      @keyframes sp-wave { 0%, 55%, 100% { transform: translateY(0); } 25% { transform: translateY(-.14em); } }
      @keyframes sp-glow { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
      @keyframes sp-bar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @keyframes sp-pop { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation: none !important; }
        .sp-p { stroke-dashoffset: 0; }
        .sp-bar { opacity: 1; }
        #splash { transition-duration: .2s; }
      }
      @media (max-width: 359.98px) { .sp-word { font-size: 32px; } .sp-mark { width: 76px; height: 76px; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading VibeBook">
      <div class="sp-glow" aria-hidden="true"></div>
      <div class="sp-in">
        <svg class="sp-mark" viewBox="0 0 64 64" aria-hidden="true">
          <path class="sp-p sp-l" pathLength="1" style="--i:0" d="M32 16C26 12 16 12 7 14v34c9-2 19-1 25 3" />
          <path class="sp-p sp-r" pathLength="1" style="--i:0" d="M32 16c6-4 16-4 25-2v34c-9-2-19-1-25 3" />
          <path class="sp-p" pathLength="1" style="--i:1" d="M32 16v35" />
          <path class="sp-p" pathLength="1" style="--i:2" d="M7 54c9-2 18-1 25 3 7-4 16-5 25-3" />
          <path class="sp-p" pathLength="1" style="--i:3" d="M13 25h13M13 31h13M13 37h8M38 25h13M38 31h13M38 37h8" />
          <path class="sp-p ray1" pathLength="1" style="--i:4" d="M18.5 9l3.5 5" />
          <path class="sp-p ray2" pathLength="1" style="--i:5" d="M32 4.5v6" />
          <path class="sp-p ray3" pathLength="1" style="--i:6" d="M45.5 9L42 14" />
        </svg>
        <div class="sp-word" aria-hidden="true"><b class="a" style="--i:0">V</b><b class="a" style="--i:1">i</b><b class="a" style="--i:2">b</b><b class="a" style="--i:3">e</b><b style="--i:4">B</b><b style="--i:5">o</b><b style="--i:6">o</b><b style="--i:7">k</b></div>
        <div class="sp-bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
